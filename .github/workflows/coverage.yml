name: Coverage

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

env:
    CARGO_TERM_COLOR: always

jobs:
    # ── Rust coverage: cargo test + embedded-Python integration tests ────
    rust-coverage:
        name: Rust Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            - name: Setup pixi (provides libpython for the embedded tests)
              uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: v0.41.4
                  locked: true
                  cache: true

            - name: Generate Rust coverage
              env:
                  PYO3_PYTHON: ${{ github.workspace }}/.pixi/envs/default/bin/python
                  LD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/default/lib
              run: cargo llvm-cov --lib --features python --lcov --output-path rust-lcov.info

            - name: Upload Rust coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: rust-lcov.info
                  flags: rust
                  fail_ci_if_error: false
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    # ── Python coverage with pytest-cov ──────────────────────────────────
    python-coverage:
        name: Python Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: actions/cache@v4
              with:
                  path: target
                  key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

            - name: Setup pixi
              uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: v0.67.2
                  locked: true
                  cache: true

            - name: Build extension
              run: pixi run develop

            - name: Run Python tests with coverage
              run: .pixi/envs/default/bin/python -m pytest tests/test_python_api.py -v --cov=rapidtrees --cov-report=xml:python-coverage.xml

            - name: Upload Python coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  files: python-coverage.xml
                  flags: python
                  fail_ci_if_error: false
              env:
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
