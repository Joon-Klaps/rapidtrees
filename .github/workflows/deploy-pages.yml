name: Deploy WASM site to GitHub Pages

on:
    push:
        branches: [master, main]
        paths:
            - 'src/**'
            - 'www/**'
            - 'Cargo.toml'
            - '.github/workflows/deploy-pages.yml'
    workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
    contents: read
    pages: write
    id-token: write

# Only one concurrent deployment; let in-progress runs finish.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build WASM bundle
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.toml') }}

            - name: Install wasm-pack
              uses: jetli/wasm-pack-action@v0.4.0
              with:
                  version: latest

            - name: Build WASM bundle
              # wasm-opt is disabled in Cargo.toml metadata, so no binaryen download.
              run: wasm-pack build --target web --out-dir www/pkg --no-default-features --features wasm

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: www

    deploy:
        name: Deploy to Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
