name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

env:
    CARGO_TERM_COLOR: always

jobs:
    rust-test:
        name: Rust Tests
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                rust: [stable]

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ matrix.rust }}

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Build
              run: cargo build --verbose

            - name: Run tests
              run: cargo test --verbose --lib

            - name: Build release
              run: cargo build --release --verbose

    python-test:
        name: Python API Tests (${{ matrix.os }}, ${{ matrix.environment }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
                environment: [py310, py311, py312]

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-${{ matrix.environment }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Setup pixi
              uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: latest
                  locked: true
                  environments: ${{ matrix.environment }}

            - name: Run Python API tests
              run: pixi run -e ${{ matrix.environment }} test-python