name: CI

on:
    push:
        branches: [master, main]
        paths-ignore:
          - '**.md'
    pull_request:
        branches: [master, main]
        paths-ignore:
          - '**.md'

env:
    CARGO_TERM_COLOR: always

jobs:
    rust-test:
        name: Rust Tests
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                rust: [stable]

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ matrix.rust }}

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Setup pixi
              uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: v0.67.2
                  locked: true
                  cache: true

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Run tests
              # --features python compiles src/api.rs + src/progress.rs and
              # their unit + embedded-Python integration tests.
              env:
                  PYO3_PYTHON: ${{ github.workspace }}/.pixi/envs/default/bin/python
                  LD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/default/lib
                  DYLD_FALLBACK_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/default/lib:/usr/local/lib:/usr/lib
              run: cargo test --verbose --lib --features python

    python-test:
        name: Python API Tests (${{ matrix.os }}, ${{ matrix.environment }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest, macos-latest]
                environment: [py310, py311, py312]

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-${{ matrix.environment }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Setup pixi
              uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: v0.67.2
                  locked: true
                  environments: ${{ matrix.environment }}
                  cache: true

            - name: Run Python API tests
              run: pixi run -e ${{ matrix.environment }} test-python

    wasm-compat:
        name: Wasm Compatibility
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                      tests/wasm/target
                  key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock', 'tests/wasm/Cargo.toml') }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Check wasm32 build (no default features)
              run: cargo check --lib --no-default-features --target wasm32-unknown-unknown

            - name: Clippy on the wasm32 build
              run: cargo clippy --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings

            - name: Lint the wasm smoke-test harness
              working-directory: tests/wasm
              run: |
                  cargo fmt -- --check
                  cargo clippy --target wasm32-unknown-unknown -- -D warnings

            # Compiling is not running: a rayon pool, std::fs or std::time::Instant on the
            # wasm path builds fine and only traps once called. This loads the wasm32 build
            # in Node, reads every BEAST file in tests/data, and checks the RF, weighted RF
            # and KF matrices against the native CLI.
            - name: Run the wasm32 build on BEAST files
              run: node tests/wasm/run.ts
