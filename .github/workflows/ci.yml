name: CI

on:
    push:
        branches: [master, main]
        paths-ignore:
          - '**.md'
    pull_request:
        branches: [master, main]
        paths-ignore:
          - '**.md'

env:
    CARGO_TERM_COLOR: always

jobs:
    rust-test:
        name: Rust Tests
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
                rust: [stable]

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: ${{ matrix.rust }}

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Setup pixi
              uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: v0.41.4
                  locked: true
                  cache: true

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Run tests
              # --features python compiles src/api.rs + src/progress.rs and
              # their unit + embedded-Python integration tests.
              env:
                  PYO3_PYTHON: ${{ github.workspace }}/.pixi/envs/default/bin/python
                  LD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/default/lib
                  DYLD_LIBRARY_PATH: ${{ github.workspace }}/.pixi/envs/default/lib
              run: cargo test --verbose --lib --features python

    python-test:
        name: Python API Tests (${{ matrix.os }}, ${{ matrix.environment }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest, macos-latest]
                environment: [py310, py311, py312]

        steps:
            - uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo build
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-${{ matrix.environment }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Setup pixi
              uses: prefix-dev/setup-pixi@v0
              with:
                  pixi-version: v0.67.2
                  locked: true
                  environments: ${{ matrix.environment }}
                  cache: true

            - name: Build extension
              run: pixi run -e ${{ matrix.environment }} develop

            - name: Run Python API tests
              run: .pixi/envs/${{ matrix.environment }}/bin/python -m pytest tests/test_python_api.py -v