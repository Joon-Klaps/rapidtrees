# Pre-commit hooks for Rust project
# Install pre-commit: pip install pre-commit
# Setup hooks: pre-commit install

repos:
    - repo: local
      hooks:
          - id: pixi-lock
            name: pixi lock
            description: Update pixi.lock to match pixi.toml/pyproject.toml
            entry: pixi lock
            language: system
            files: ^(pixi\.toml|pyproject\.toml)$
            pass_filenames: false

          - id: cargo-fmt
            name: cargo fmt
            description: Format Rust code with cargo fmt
            entry: cargo fmt --all
            language: system
            types: [rust]
            pass_filenames: false

          - id: cargo-clippy
            name: cargo clippy
            description: Lint Rust code with cargo clippy
            entry: cargo clippy --all-targets --all-features --fix --allow-staged --allow-dirty -- -D warnings
            language: system
            types: [rust]
            pass_filenames: false

          - id: cargo-check
            name: cargo check
            description: Check if Rust code compiles
            entry: cargo check --all-targets --all-features
            language: system
            types: [rust]
            pass_filenames: false

          - id: cargo-check-wasm
            name: cargo check (wasm32)
            description: >-
                Hold this crate to its wasm-compatibility promise. Needs the
                real wasm32 target: a host-target check passes even when a
                rayon/pyo3-only path has crept in. Requires
                `rustup target add wasm32-unknown-unknown`.
            entry: cargo check --lib --no-default-features --target wasm32-unknown-unknown
            language: system
            types: [rust]
            pass_filenames: false
