[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rapidtrees"
version = "0.3.1"
description = "Fast tree distance calculations (Robinson-Foulds, Weighted RF, Kuhner-Felsenstein) for phylogenetic trees"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["phylogenetics", "tree-distance", "robinson-foulds", "bioinformatics", "kuhner-felsenstein"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Joon-Klaps/rapidtrees"
Repository = "https://github.com/Joon-Klaps/rapidtrees"

[project.optional-dependencies]
dev = ["pytest", "numpy>=2.2.6", "pytest-cov"]

[tool.maturin]
features = ["python"]
module-name = "rapidtrees"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
r-phangorn = "*"
r-ape = "*"
pytest = "*"
numpy = ">=2.2"
pytest-cov = "*"
prek = "*"

[tool.pixi.pypi-dependencies]
rapidtrees = { path = ".", editable = true }

[tool.pixi.tasks]
test-rust = { cmd = "cargo test --lib", description = "Run Rust unit tests" }
test-python = { cmd = "pytest tests/test_python_api.py -v", description = "Run Python API tests" }
test-python-cov = { cmd = "pytest tests/test_python_api.py -v --cov=rapidtrees --cov-report=xml:python-coverage.xml", description = "Run Python tests with coverage" }
fmt = { cmd = "cargo fmt --check", description = "Check Rust formatting" }
clippy = { cmd = "cargo clippy --all-targets --all-features -- -D warnings", description = "Run Clippy linter" }
bench = { cmd = "cargo bench", description = "Run performance benchmarks" }
pre-commit = { cmd = "prek run --config .pre-commit-config.yaml --all-files" }