[package]
name = "rapidtrees"
version = "0.7.1"
edition = "2024"
description = "Fast pairwise tree distance calculations (Robinson-Foulds, Weighted RF, Kuhner-Felsenstein) for phylogenetic trees"
license = "MIT"
repository = "https://github.com/Joon-Klaps/rapidtrees"
homepage = "https://github.com/Joon-Klaps/rapidtrees"
readme = "README.md"
keywords = ["phylogenetics", "tree-distance", "robinson-foulds", "bioinformatics"]
categories = ["science", "command-line-utilities"]

[lib]
name = "rapidtrees"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rapidtrees"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# `default-features = false` drops phylotree's CLI-only deps — `needletail`
# pulls in the bzip2 and xz C libraries, which have no wasm build.
phylotree = { version = "0.1.3", default-features = false }
pyo3 = { version = "0.27.1", optional = true }
rayon = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
rustc-hash = "2.1"
hashbrown = "0.17.1"
wasm-bindgen = { version = "0.2.126", optional = true }
# Pure-Rust linear algebra, used for the small dense eigenproblem inside PCoA.
# Deliberately NOT `nalgebra-lapack` / `ndarray-linalg`: those bind to Fortran
# LAPACK and do not build for wasm32 at all.
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
statrs = "0.18"

[features]
default = ["cli", "parallel"]
cli = ["clap", "flate2"]
# Rayon-backed parallelism. On by default; off for wasm32, where rayon cannot
# spawn threads without `wasm-bindgen-rayon` and cross-origin isolation.
# See `src/par.rs`.
parallel = ["rayon"]
python = ["pyo3", "parallel"]
extension-module = ["python", "pyo3/extension-module"]
# Browser bindings. Build with:
#   wasm-pack build --target web --no-default-features --features wasm
wasm = ["wasm-bindgen"]

# Until https://github.com/lucblassel/phylotree-rs/pull/18 lands, take
# phylotree from the fork that makes it wasm-clean. Pinned to a rev rather
# than a branch so review force-pushes cannot silently change a build.
[patch.crates-io]
phylotree = { git = "https://github.com/Joon-Klaps/phylotree-rs", rev = "a2391b7" }

[dev-dependencies]
itertools = "0.14.0"
rand = "0.10.1"
criterion = "0.8.2"
cpu-time = "1.0.0"
memory-stats = "1.0.0"
tempfile = "3"
divan = { package = "codspeed-divan-compat", version = "4" }

[[bench]]
name = "memory_time_benchmark"
harness = false

[[bench]]
name = "codspeed"
harness = false
