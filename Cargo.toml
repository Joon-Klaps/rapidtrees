# This package is also the workspace root, so `[patch.crates-io]` below applies
# to every member. A patch table in a member manifest is silently ignored.
[workspace]
members = ["treetracer-core"]
# Explicit rather than inherited from edition 2024: v1 unifies features across
# members, which would drag pyo3/rayon into the wasm build of `treetracer-core`.
resolver = "3"

[package]
name = "rapidtrees"
version = "0.7.1"
edition = "2024"
description = "Fast pairwise tree distance calculations (Robinson-Foulds, Weighted RF, Kuhner-Felsenstein) for phylogenetic trees"
license = "MIT"
repository = "https://github.com/Joon-Klaps/rapidtrees"
homepage = "https://github.com/Joon-Klaps/rapidtrees"
readme = "README.md"
keywords = ["phylogenetics", "tree-distance", "robinson-foulds", "bioinformatics"]
categories = ["science", "command-line-utilities"]

[lib]
name = "rapidtrees"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rapidtrees"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# `default-features = false` drops phylotree's CLI-only deps — `needletail`
# pulls in the bzip2 and xz C libraries, which have no wasm build.
phylotree = { version = "0.1.3", default-features = false }
pyo3 = { version = "0.27.1", optional = true }
rayon = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
rustc-hash = "2.1"
hashbrown = "0.17.1"

[features]
default = ["cli", "parallel"]
cli = ["clap", "flate2"]
# Rayon-backed parallelism. On by default; off for wasm32, where rayon cannot
# spawn threads without `wasm-bindgen-rayon` and cross-origin isolation.
# See `src/par.rs`.
parallel = ["rayon"]
python = ["pyo3", "parallel"]
extension-module = ["python", "pyo3/extension-module"]
# NOTE: there is no `wasm` feature here any more. Browser bindings live in the
# `treetracer-core` member, which depends on this crate with
# `default-features = false`. This crate stays wasm-*compatible* (that is what
# the phylotree fork, the `parallel` gate and the pure-Rust deps buy) without
# knowing that wasm-bindgen exists.

# Until https://github.com/lucblassel/phylotree-rs/pull/18 lands, take
# phylotree from the fork that makes it wasm-clean. Pinned to a rev rather
# than a branch so review force-pushes cannot silently change a build.
[patch.crates-io]
phylotree = { git = "https://github.com/Joon-Klaps/phylotree-rs", rev = "a2391b7" }

[dev-dependencies]
itertools = "0.14.0"
rand = "0.10.1"
criterion = "0.8.2"
cpu-time = "1.0.0"
memory-stats = "1.0.0"
tempfile = "3"
divan = { package = "codspeed-divan-compat", version = "4" }

[[bench]]
name = "memory_time_benchmark"
harness = false

[[bench]]
name = "codspeed"
harness = false
