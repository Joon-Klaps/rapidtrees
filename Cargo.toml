[package]
name = "rapidtrees"
version = "0.8.3"
edition = "2024"
description = "Fast pairwise tree distance calculations (Robinson-Foulds, Weighted RF, Kuhner-Felsenstein) for phylogenetic trees"
license = "MIT"
repository = "https://github.com/Joon-Klaps/rapidtrees"
homepage = "https://github.com/Joon-Klaps/rapidtrees"
readme = "README.md"
keywords = ["phylogenetics", "tree-distance", "robinson-foulds", "bioinformatics"]
categories = ["science", "command-line-utilities"]

[lib]
name = "rapidtrees"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rapidtrees"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Until https://github.com/lucblassel/phylotree-rs/pull/18 lands, take
# phylotree from the fork that makes it wasm-clean. Pinned to a rev rather
phylotree = { version = "0.1.3", default-features = false }
pyo3 = { version = "0.29.2", optional = true }
rayon = { version = "1", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
flate2 = { version = "1.1.10", optional = true }
rustc-hash = "2.1.3"
hashbrown = "0.17.1"

[features]
default = ["cli", "parallel"]
cli = ["clap", "flate2"]
# Rayon-backed parallelism (`par.rs`). On by default; off for wasm32.
parallel = ["rayon"]
python = ["pyo3", "parallel"]
# Check every fingerprint match against the leaf set it stands for. Off by
# default (it re-materialises a bitset per occurrence); CI runs the suite with
# it on, so the fast path is continuously checked against the exact one.
verify = []
extension-module = ["python", "pyo3/extension-module"]

# Until https://github.com/lucblassel/phylotree-rs/pull/18 lands, take
# phylotree from the fork that makes it wasm-clean. Pinned to a rev rather
# than a branch so review force-pushes cannot silently change a build.
[patch.crates-io]
phylotree = { git = "https://github.com/Joon-Klaps/phylotree-rs", rev = "a2391b7" }

[dev-dependencies]
rand = "0.10.2"
criterion = "0.8.2"
cpu-time = "1.0.0"
memory-stats = "1.0.0"
tempfile = "3"
divan = { package = "codspeed-divan-compat", version = "5.0.1" }
rayon = "1"

[[bench]]
name = "memory_time_benchmark"
harness = false

[[bench]]
name = "codspeed"
harness = false
