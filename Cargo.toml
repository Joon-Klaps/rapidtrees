[package]
name = "rapidtrees"
version = "0.6.0"
edition = "2024"
description = "Fast pairwise tree distance calculations (Robinson-Foulds, Weighted RF, Kuhner-Felsenstein) for phylogenetic trees"
license = "MIT"
repository = "https://github.com/Joon-Klaps/rapidtrees"
homepage = "https://github.com/Joon-Klaps/rapidtrees"
readme = "README.md"
keywords = ["phylogenetics", "tree-distance", "robinson-foulds", "bioinformatics"]
categories = ["science", "command-line-utilities"]

[lib]
name = "rapidtrees"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rapidtrees"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
phylotree = { version = "0.1.3", optional = true }
pyo3 = { version = "0.27.1", optional = true }
rayon = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
rustc-hash = "2.1"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["cli"]
cli = ["phylotree", "clap", "flate2", "rayon"]
python = ["phylotree", "pyo3", "rayon"]
extension-module = ["python", "pyo3/extension-module"]
# Browser/WebAssembly build. Mutually exclusive with the phylotree-backed
# features above: it swaps in the in-crate `phylotree-patch` Newick parser and
# drops rayon (GitHub Pages can't set the COOP/COEP headers SharedArrayBuffer
# needs). Build with: `--no-default-features --features wasm`.
wasm = ["wasm-bindgen", "console_error_panic_hook"]

[dev-dependencies]
itertools = "0.14.0"
rand = "0.9.2"
criterion = "0.7.0"
cpu-time = "1.0.0"
memory-stats = "1.0.0"
tempfile = "3"

[[bench]]
name = "memory_time_benchmark"
harness = false

# Disable wasm-opt so `wasm-pack build` is self-contained and does not need to
# download the binaryen toolchain at build time. The bundle is slightly larger;
# for an aggressively optimised build, install binaryen and flip this to `true`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
